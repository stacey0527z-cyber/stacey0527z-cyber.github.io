:root{
  --paper:#ffffff;
  --ink:rgba(0,0,0,.76);
  --soft:rgba(0,0,0,.44);
  --faint:rgba(0,0,0,.26);
  --hair:rgba(0,0,0,.13);
  --field:#f1f1ef;
  --serif:"Newsreader","Noto Serif SC",Georgia,"Songti SC",serif;
  --hand:"Cangerge Vlog","Hanken Grotesk",cursive;
  --sans:"Hanken Grotesk","Noto Sans SC",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --bar:44px;
  --gut:max(14px,env(safe-area-inset-left,0px));
  --gutr:max(14px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  font-weight:200;font-size:14.5px;line-height:1.6;letter-spacing:-.017em;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,dl,dd,figure{margin:0}
ul{list-style:none;padding:0}
a{color:inherit;text-decoration:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
canvas,img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sans{font-family:var(--sans);letter-spacing:0}
.zh{font-family:"Noto Serif SC",serif;font-weight:200}

/* ───── 开屏 ───── */
.splash{position:fixed;inset:0;z-index:70;background:var(--paper);
  display:flex;flex-direction:column;transition:opacity .75s ease}
.splash.away{opacity:0;pointer-events:none}
.splash-plate{position:absolute;inset:0;overflow:hidden}
.splash-plate canvas,.splash-plate img{width:100%;height:100%;object-fit:cover}
.rain{position:absolute;inset:0;z-index:1;pointer-events:none;
  transition:opacity .9s ease}
.splash-ui{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;
  justify-content:space-between;color:#fff;
  padding:max(20px,env(safe-area-inset-top,0px)) var(--gutr)
          max(20px,env(safe-area-inset-bottom,0px)) var(--gut)}
.splash-ui::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 24%,rgba(0,0,0,0) 58%,rgba(0,0,0,.4))}
.splash-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem}
.splash-row.b{align-items:flex-end}
.splash-name{font-family:var(--hand);font-weight:400;font-size:36px;letter-spacing:.01em;line-height:1.15}
.splash-name span{display:block;font-family:"Noto Serif SC",serif;font-weight:200;font-size:12px;
  letter-spacing:.42em;opacity:.78;margin-top:.5em}
.splash-meta{text-align:right;font-size:12.5px;opacity:.8;line-height:1.75}
.start{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.55em}
.start b{font-family:var(--sans);font-weight:200;font-size:21px;letter-spacing:.12em}
.start i{font-style:normal;font-size:11.5px;letter-spacing:.3em;opacity:.72}
.start .bar{display:block;height:1px;width:66px;background:currentColor;opacity:.55;
  transition:width .5s ease}
.start:hover .bar{width:118px}

/* ───── 外壳 ───── */
.shell{min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--hair);padding:12px var(--gutr) 11px var(--gut);
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:21;background:var(--paper)}
.topnav{display:flex;flex-wrap:nowrap;justify-content:flex-end;gap:0 24px;font-size:14px}
.topnav a{color:var(--soft);transition:color .25s}
.topnav a:hover,.topnav a[aria-current="page"]{color:var(--ink)}
.brand{font-family:var(--hand);font-weight:400;font-size:32px;letter-spacing:.01em;
  line-height:1.1;white-space:nowrap;text-align:left;order:-1}

#views{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.view{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* ───── 主页大图 ───── */
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  position:relative;padding:clamp(22px,4.5vh,52px) clamp(44px,7vw,96px)}
.stage figure{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.stage .holder{position:relative;overflow:hidden;background:var(--field);line-height:0;
  aspect-ratio:var(--r,1.5);margin-inline:auto;
  width:min(100%,calc(min(60vh,620px) * var(--r,1.5)))}
.stage .holder img,.stage .holder canvas{position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;opacity:0;
  transform:translateX(var(--dx,0));
  transition:opacity .55s ease,transform .8s cubic-bezier(.22,.61,.24,1)}
.stage .holder img.on,.stage .holder canvas.on{opacity:1;transform:translateX(0)}
.stage .holder img.out,.stage .holder canvas.out{opacity:0;transform:translateX(var(--dxo,0))}
.stage figcaption{color:var(--soft);font-size:12.5px;text-align:center;line-height:1.8;
  transition:opacity .3s ease}
.stage figcaption.fade{opacity:0}
.stage figcaption a{color:var(--ink);border-bottom:1px solid var(--hair);
  padding-bottom:1px;transition:border-color .25s}
.stage figcaption a:hover{border-color:var(--ink)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:31px;height:31px;
  border:1px solid var(--hair);border-radius:50%;color:var(--faint);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  transition:color .25s,border-color .25s;background:var(--paper)}
.arrow:hover{color:var(--ink);border-color:var(--soft)}
.arrow.l{left:clamp(6px,2vw,34px)}
.arrow.r{right:clamp(6px,2vw,34px)}
.s-head .note{color:var(--soft);font-size:12.5px;margin-top:.35em;max-width:40ch}

/* ───── 系列图墙 ───── */
.gridpad{width:100%;max-width:1360px;margin-inline:auto;
  padding-top:clamp(26px,5vw,60px);padding-bottom:clamp(60px,12vh,140px);
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gridpad{padding-inline:clamp(40px,6vw,92px)}}
.s-head{display:flex;flex-direction:column;align-items:flex-end;text-align:right;
  gap:.2em;padding-bottom:clamp(10px,2vh,24px)}
.s-head h2{font-family:var(--hand);font-size:26px;font-weight:400;letter-spacing:.01em}
.s-head .zh{font-size:12px;letter-spacing:.44em;margin-right:-.44em;color:var(--soft)}
.s-head .meta{color:var(--faint);font-size:12.5px;margin-top:.5em}
.seq{display:flex;flex-direction:column;gap:clamp(56px,10vh,132px);
  padding-top:clamp(20px,4vh,44px)}
.beat{display:grid;grid-template-columns:repeat(12,1fr);
  gap:clamp(14px,2.6vw,38px);align-items:start}
.plate{display:block;min-width:0;text-align:left;grid-column:var(--c,1 / -1);
  margin-top:var(--mt,0);transition:opacity .35s ease}
.plate .box{background:var(--field);overflow:hidden;line-height:0}
.plate img,.plate canvas{display:block;width:100%;height:auto}
.plate .plab{display:block;margin-top:10px;font-size:10.5px;letter-spacing:.13em;
  color:var(--faint);line-height:1.6}
@media (hover:hover){
  .seq:hover .plate{opacity:.42}
  .seq .plate:hover{opacity:1}
  .plate .box img,.plate .box canvas{transition:transform 1s cubic-bezier(.22,.61,.24,1)}
  .plate:hover .box img,.plate:hover .box canvas{transform:scale(1.025)}
}

/* ───── 文字页 ───── */

  function drawStars(host){
    if(!host)return;
    var J=function(a){return (Math.random()*2-1)*a;};
    /* 顺着一串点画线，每个点抖一下；收尾稍微过头一点，像手没停住 */
    function ink(pts,close,amp){
      var d="",i,x,y;
      for(i=0;i<pts.length;i++){
        x=pts[i][0]+J(amp);y=pts[i][1]+J(amp);

        var dx=pts[1][0]-pts[0][0],dy=pts[1][1]-pts[0][1],L=Math.hypot(dx,dy)||1;

      }
      return d;

          co=Math.cos(rot||0), si=Math.sin(rot||0), j, P0, P1, P2, x, y;

          t=i/10;u=1-t;

          y=u*u*P0[1]+2*u*t*P1[1]+t*t*P2[1];

      {k:4,x:30,y:112,r:7,w:1.1,tw:1,dl:-1.8},
      {k:5,x:168,y:112,r:17,rot:-.22,w:1.5,tw:0},
      {k:4,x:96,y:128,r:9,w:1.2,tw:1,dl:-2.6},
      {k:5,x:120,y:188,r:23,rot:.3,w:1.6,tw:1,dl:-.6},
      {k:4,x:54,y:166,r:11,w:1.3,tw:1,dl:-2.3},
      {k:4,x:190,y:196,r:12,w:1.3,tw:0},
      {k:5,x:46,y:230,r:13,rot:-.1,w:1.4,tw:0},
      {k:4,x:150,y:244,r:8,w:1.2,tw:1,dl:-1.5}

      if(e.key==="Escape"){e.preventDefault();shut();}
      else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
      else if(e.key==="ArrowRight"){e.preventDefault();step(1);}
      return;
    }
    if((location.hash||"#works")==="#works"){
      if(e.key==="ArrowLeft"){e.preventDefault();reelStep(-1);}
      else if(e.key==="ArrowRight"){e.preventDefault();reelStep(1);}
    }
  });

  /* ── 一颗水滴的外形：尖顶、圆底。wob = 每帧重抖的幅度 ── */
  function dropPts(ox,oy,s,wob){
    var pts=[],i,u,th,N=12,M=18,R=.42,CY=.58,w=wob||0,
        p1=Math.random()*6.3,p2=Math.random()*6.3,
        jx=w?(Math.random()*2-1)*.45:0,jy=w?(Math.random()*2-1)*.45:0,
        m=function(k){                        // 平缓起伏，不是逐点乱抖
          return 1+w*(Math.sin(k*4.1+p1)*.6+Math.sin(k*7.3+p2)*.4);
        };
    for(i=0;i<=N;i++){                        // 右侧，从尖端下来
      u=i/N;
      pts.push([ox+R*Math.pow(u,1.35)*m(u)*s+jx,oy+(-1+(CY+1)*u)*s+jy]);
    }
    for(i=1;i<=M;i++){                        // 底部圆弧
      th=(i/M)*Math.PI;u=1+i/M;
      pts.push([ox+Math.cos(th)*R*m(u)*s+jx,oy+(CY+Math.sin(th)*R*m(u))*s+jy]);
    }
    for(i=N-1;i>=0;i--){                      // 左侧回到尖端
      u=i/N;
      pts.push([ox-R*Math.pow(u,1.35)*m(u+2)*s+jx,oy+(-1+(CY+1)*u)*s+jy]);
    }
    return pts;
  }
  function pathOf(pts){
    var dstr="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
    for(var i=1;i<pts.length;i++)dstr+="L"+pts[i][0].toFixed(1)+","+pts[i][1].toFixed(1);
    return dstr;
  }

  /* ── 水滴光标：雨停后接管鼠标，带滞后，移动时被拉长 ── */
  CURSOR=(function(){
    var mq=window.matchMedia,
        fine=mq&&mq("(hover:hover) and (pointer:fine)").matches,
        calm=mq&&mq("(prefers-reduced-motion: reduce)").matches;
    if(!fine||calm)return null;
    var SHAPE=pathOf(dropPts(0,0,100,.05))+"Z";
    var d=document.createElement("div");
    d.className="drop";d.setAttribute("aria-hidden","true");
    d.innerHTML='<svg viewBox="-54 -114 108 228" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="'+SHAPE+'" fill="rgba(18,54,92,.26)" transform="translate(5,8)"/>'+
      '<path d="'+SHAPE+'" fill="#4FA8E8"/>'+
      '<path d="'+SHAPE+'" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="7"/>'+
      '</svg>';
    document.body.appendChild(d);
    var tx=0,ty=0,x=0,y=0,px=0,py=0,ang=0,hot=0,known=0,on=0;
    document.addEventListener("mousemove",function(e){
      tx=e.clientX;ty=e.clientY;
      if(!known){known=1;x=px=tx;y=py=ty;}
      if(on)d.style.opacity="1";
      var t=e.target;
      hot=(t&&t.closest&&t.closest("a,button,.plate"))?1:0;
    });
    document.addEventListener("mouseleave",function(){d.style.opacity="0";});
    (function loop(){
      if(on){
        x+=(tx-x)*0.22;y+=(ty-y)*0.22;
        var vx=x-px,vy=y-py;px=x;py=y;
        var sp=Math.sqrt(vx*vx+vy*vy),k=Math.min(sp,26)/26;
        if(sp>0.7)ang=Math.atan2(vy,vx)*180/Math.PI-90;
        var g=hot?1.5:1;
        d.style.transform="translate3d("+(x-7)+"px,"+(y-15)+"px,0) rotate("+ang+
          "deg) scale("+((1-k*0.25)*g).toFixed(3)+","+((1+k*0.5)*g).toFixed(3)+")";
      }
      requestAnimationFrame(loop);
    })();
    return {
      at:function(){return known?[x,y]:null;},
      enable:function(ax,ay){
        if(on)return;
        on=1;document.documentElement.classList.add("drops");
        if(!known&&ax!=null){x=px=tx=ax;y=py=ty=ay;}
        d.style.transform="translate3d("+(x-7)+"px,"+(y-15)+"px,0)";
        d.style.opacity="1";
      }
    };
  })();

  /* ── 开屏的雨：手绘感的蓝水滴，最后一滴落进鼠标，变成光标 ── */
  rain=(function(){
    var cv=document.getElementById("rain"),cx=cv.getContext("2d"),
        W=0,H=0,drops=[],rings=[],hero=null,raf=0,last=0,t=0,acc=0,fa=0,
        live=false,handed=false;

    function size(){
      var dpr=Math.min(window.devicePixelRatio||1,2);
      W=splash.clientWidth||window.innerWidth;
      H=splash.clientHeight||window.innerHeight;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
      cv.style.width=W+"px";cv.style.height=H+"px";
      cx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener("resize",function(){if(live)size();});

    var WHITE="#ffffff",SKY="#4FA8E8";
    function path(pts){
      cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);
      for(var i=1;i<pts.length;i++)cx.lineTo(pts[i][0],pts[i][1]);
      cx.closePath();
    }
    function shade(){
      cx.shadowColor="rgba(16,52,90,.3)";cx.shadowBlur=5;cx.shadowOffsetY=2;
    }
    function drawDrop(x,y,s,col,a){
      cx.save();shade();
      path(dropPts(x,y,s,.075));
      cx.globalAlpha=a;cx.fillStyle=col;cx.fill();
      cx.restore();
    }
    /* 落地的涟漪：一圈开口的卷线 */
    function curlPts(x,y,r,seed){
      var N=26,pts=[],i,th,rr;
      for(i=0;i<=N;i++){
        th=(i/N)*1.45*6.283+seed;
        rr=r*(.3+.7*i/N);
        pts.push([x+Math.cos(th)*rr+(Math.random()*2-1)*1,
                  y+Math.sin(th)*rr*.34+(Math.random()*2-1)*.8]);
      }
      return pts;
    }
    function drawCurl(g){
      cx.save();shade();
      cx.lineCap="round";cx.lineJoin="round";cx.lineWidth=2.2;
      cx.globalAlpha=g.a;cx.strokeStyle=g.col;
      var pts=curlPts(g.x,g.y,g.r,g.seed);
      cx.beginPath();cx.moveTo(pts[0][0],pts[0][1]);
      for(var i=1;i<pts.length;i++)cx.lineTo(pts[i][0],pts[i][1]);
      cx.stroke();cx.restore();
    }
    function spawn(y0){
      drops.push({x:Math.random()*W,
        y:y0==null?(-30-Math.random()*240):y0,
        s:10+Math.random()*10,v:230+Math.random()*260,
        sw:(Math.random()-.5)*26,ph:Math.random()*6.3,
        col:Math.random()<.5?WHITE:SKY,a:.92+Math.random()*.08});
    }
    function seed(){            /* 开屏第一眼就已经在下 */
      for(var i=0;i<16;i++)spawn(-120+Math.random()*(H*.95+120));
    }
    function makeHero(){
      var at=CURSOR&&CURSOR.at();
      hero={x:W*(.35+Math.random()*.3),y:-30,v:280,s:13,col:SKY,
        tx:at?at[0]:W*.5,ty:at?at[1]:H*.52,lock:false};
    }
    function fade(){
      if(!live)return;
      live=false;cv.style.opacity="0";
      setTimeout(function(){cancelAnimationFrame(raf);cx.clearRect(0,0,W,H);},950);
    }
    function hand(){
      if(!handed){
        handed=true;
        if(CURSOR)CURSOR.enable(hero?hero.x:W*.5,hero?hero.y:H*.52);
      }
      hero=null;fade();
    }

    /* 逐帧：每秒只重画 12 次，线条每帧重抖一遍 */
    var STEP=1/12;
    function step(now){
      if(!live)return;
      raf=requestAnimationFrame(step);
      fa+=Math.min((now-last)/1000,.1);last=now;
      if(fa<STEP)return;
      var dt=fa;fa=0;t+=dt;

      cx.clearRect(0,0,W,H);

      var rate=t<3.2?19:(t<4.4?19*(1-(t-3.2)/1.2):0);
      acc+=rate*dt;
      while(acc>=1&&t<4.4){acc-=1;spawn();}
      if(t>4.1&&!hero&&!handed)makeHero();

      var i,d,g;
      for(i=drops.length-1;i>=0;i--){
        d=drops[i];d.ph+=dt*2.4;d.y+=d.v*dt;
        var dx=d.x+Math.sin(d.ph)*d.sw*.05;
        if(d.y>H*.95){
          rings.push({x:dx,y:H*.95,r:d.s*.7,a:.85,col:d.col,seed:Math.random()*6.3});
          drops.splice(i,1);continue;
        }
        drawDrop(dx,d.y,d.s,d.col,d.a);
      }

      for(i=rings.length-1;i>=0;i--){
        g=rings[i];g.r+=dt*52;g.a-=dt*1.25;
        if(g.a<=0){rings.splice(i,1);continue;}
        drawCurl(g);
      }

      if(hero){
        if(!hero.lock){
          hero.y+=hero.v*dt;
          if(t>4.9||hero.y>H*.3)hero.lock=true;
        }else{
          hero.x+=(hero.tx-hero.x)*.3;
          hero.y+=(hero.ty-hero.y)*.3;
          hero.s+=(14-hero.s)*.3;
          if(Math.abs(hero.tx-hero.x)<4&&Math.abs(hero.ty-hero.y)<4)hand();
        }
        if(hero)drawDrop(hero.x,hero.y,hero.s,hero.col,1);
      }

      if(t>8&&!handed)hand();
      else if(t>6.8&&handed)fade();
    }

    return {
      play:function(){
        var calm=window.matchMedia&&
                 window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if(calm){if(CURSOR)CURSOR.enable();return;}
        size();drops=[];rings=[];hero=null;t=0;acc=0;fa=STEP;seed();
        cv.style.opacity="1";live=true;last=performance.now();
        raf=requestAnimationFrame(step);
      },
      stop:function(){
        if(live){cv.style.opacity="0";live=false;cancelAnimationFrame(raf);}
        if(!handed){handed=true;if(CURSOR)CURSOR.enable();}
      }
    };
  })();
  rain.play();

  /* ── 复制邮箱 ── */
  function toast(m){var t=document.createElement("div");t.className="toast";
    t.textContent=m;t.setAttribute("role","status");document.body.appendChild(t);
    setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},1800);}
  document.getElementById("copy").addEventListener("click",function(){
    var el=document.getElementById("mail"),txt=el.textContent.trim();
    function fb(){try{var r=document.createRange();r.selectNodeContents(el);
      var s=window.getSelection();s.removeAllRanges();s.addRange(r);
      toast("已选中，按 ⌘/Ctrl + C");}catch(e){toast("请手动选中复制");}}
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(function(){toast("Copied");},fb);
    else fb();
  });
})();
</script>
</body></html>
